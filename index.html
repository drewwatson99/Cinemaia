<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CINEMANIA — the movie nerd party game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,wght@1,800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-a: #FF006E;
    --bg-b: #8338EC;
    --bg-c: #3A86FF;
    --bg-d: #06D6A0;
    --ink: #1A1A2E;
    --paper: #FFF8E7;
    --line: rgba(26, 26, 46, .12);
    --line-strong: #1A1A2E;
    --accent: #FFBE0B;
    --accent-2: #FB5607;
    --pink: #FF006E;
    --purple: #8338EC;
    --blue: #3A86FF;
    --mint: #06D6A0;
    --coral: #EF476F;
    --shadow: 4px 4px 0 0 var(--line-strong);
    --shadow-lg: 8px 8px 0 0 var(--line-strong);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100vh; min-height: 100dvh; }
  body {
    color: var(--ink);
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, var(--bg-a), var(--bg-b) 35%, var(--bg-c) 70%, var(--bg-d));
    background-size: 300% 300%;
    animation: drift 22s ease infinite;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #app { max-width: 720px; margin: 0 auto; padding: 16px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  h1, h2, h3, .display { font-family: "Bagel Fat One", "Bowlby One", system-ui, sans-serif; font-weight: 400; letter-spacing: .02em; margin: 0; line-height: 1; text-transform: uppercase; }
  h1 { font-size: 56px; color: var(--paper); text-shadow: 4px 4px 0 var(--ink), 8px 8px 0 var(--accent); }
  h1.small { font-size: 40px; }
  h2 { font-size: 32px; color: var(--paper); text-shadow: 3px 3px 0 var(--ink); }
  h3 { font-size: 20px; color: var(--ink); }
  .serif-it { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 800; }
  .tagline { color: var(--paper); margin: 8px 0 20px; font-size: 15px; font-weight: 500; text-shadow: 1px 1px 0 var(--ink); }
  .panel {
    background: var(--paper);
    border: 3px solid var(--line-strong);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .panel.dark { background: var(--ink); color: var(--paper); }
  .panel.pink { background: var(--pink); color: var(--paper); }
  .panel.purple { background: var(--purple); color: var(--paper); }
  .panel.blue { background: var(--blue); color: var(--paper); }
  .panel.mint { background: var(--mint); color: var(--ink); }
  .panel.accent { background: var(--accent); color: var(--ink); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  label { font-size: 12px; color: var(--ink); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  .panel.dark label, .panel.pink label, .panel.purple label, .panel.blue label { color: var(--paper); }

  input, textarea, select {
    background: var(--paper); color: var(--ink); border: 3px solid var(--line-strong);
    border-radius: 10px; padding: 12px 14px; font-size: 16px; font-family: inherit; width: 100%;
    font-weight: 500;
  }
  input:focus, textarea:focus, select:focus { outline: none; box-shadow: 4px 4px 0 var(--accent); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.5; }

  button {
    background: var(--accent); color: var(--ink); border: 3px solid var(--line-strong);
    border-radius: 12px; padding: 14px 18px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    width: 100%; margin-top: 6px; box-shadow: var(--shadow); transition: transform .08s ease, box-shadow .08s ease;
    text-transform: uppercase; letter-spacing: .04em;
  }
  button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 var(--line-strong); }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: 2px 2px 0 0 var(--line-strong); }
  button.secondary { background: var(--paper); color: var(--ink); }
  button.danger { background: var(--coral); color: var(--paper); }
  button.good { background: var(--mint); color: var(--ink); }
  button.ghost { background: transparent; color: var(--ink); border-style: dashed; box-shadow: 3px 3px 0 var(--line-strong); }
  button.pink { background: var(--pink); color: var(--paper); }
  button.blue { background: var(--blue); color: var(--paper); }
  button.purple { background: var(--purple); color: var(--paper); }

  .row { display: flex; gap: 8px; align-items: stretch; }
  .row > * { flex: 1; }
  .pill { display: inline-block; background: var(--ink); color: var(--paper); border: 2px solid var(--line-strong); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .pill.you { background: var(--accent); color: var(--ink); }
  .pill.host { background: var(--pink); color: var(--paper); }
  .pill.out { background: var(--paper); color: var(--ink); text-decoration: line-through; }
  .muted { color: rgba(26,26,46,.55); }
  .panel.dark .muted, .panel.pink .muted, .panel.purple .muted, .panel.blue .muted { color: rgba(255,248,231,.7); }

  .center { text-align: center; }

  .roomcode {
    font-family: "Bagel Fat One", system-ui, sans-serif;
    font-size: 64px; letter-spacing: .15em; text-align: center;
    color: var(--accent); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 var(--pink);
    padding: 8px 0;
  }

  /* Cards (movie ticket style) */
  .card {
    background: var(--paper);
    border: 3px solid var(--line-strong);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .card .poster-wrap {
    position: relative; width: 100%; aspect-ratio: 2/3; background: var(--ink); overflow: hidden;
  }
  .card .poster {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .card .poster-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--purple), var(--pink)); color: var(--paper);
    font-family: "Bagel Fat One"; font-size: 38px; text-align: center; padding: 16px;
  }
  .card .actor-photo {
    position: absolute; top: 8px; right: 8px; width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid var(--paper); background: var(--ink); object-fit: cover; box-shadow: 2px 2px 0 var(--line-strong);
  }
  .card .label-band {
    background: var(--accent); border-top: 3px solid var(--line-strong); padding: 10px 12px;
  }
  .card .actor-name {
    font-family: "Bagel Fat One"; font-size: 22px; line-height: 1.05; color: var(--ink); word-wrap: break-word;
  }
  .card .film-title {
    font-family: "Fraunces"; font-style: italic; font-weight: 800;
    font-size: 11px; margin-top: 3px; color: var(--ink); opacity: .6; word-wrap: break-word;
  }
  .card .corner-perf {
    position: absolute; left: 0; right: 0; height: 14px; background-image: radial-gradient(circle at 7px 7px, var(--bg-b) 4px, transparent 5px);
    background-size: 14px 14px; pointer-events: none;
  }
  .card .corner-perf.top { top: -7px; }
  .card .corner-perf.bot { bottom: -7px; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 12px; }
  .pair-wrap { position: relative; }
  .vs-badge {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg);
    background: var(--accent); color: var(--ink); font-family: "Bagel Fat One"; font-size: 22px;
    padding: 8px 14px; border-radius: 12px; border: 3px solid var(--line-strong); box-shadow: 3px 3px 0 var(--line-strong); z-index: 3;
  }

  .timer {
    font-family: "Bagel Fat One"; font-size: 80px; text-align: center; padding: 4px 0;
    color: var(--paper); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 var(--pink);
  }
  .timer.warn { color: var(--accent); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 var(--coral); }
  .timer.danger { color: var(--coral); text-shadow: 3px 3px 0 var(--ink); animation: shake .5s infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  .scoreboard { display: flex; flex-direction: column; gap: 6px; }
  .scoreboard .row-line { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--paper); border: 2px solid var(--line-strong); border-radius: 10px; box-shadow: 3px 3px 0 var(--line-strong); }
  .scoreboard .row-line.leader { background: var(--accent); }
  .scoreboard .row-line.out { opacity: .4; }
  .scoreboard .row-line.active { background: var(--mint); }

  .chain-display { background: var(--paper); padding: 12px; border-radius: 10px; line-height: 1.6; word-break: break-word; border: 2px solid var(--line-strong); }
  .chain-display .arrow { color: var(--pink); margin: 0 6px; font-weight: 800; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); border: 3px solid var(--accent); border-radius: 12px; padding: 12px 18px; z-index: 100; max-width: 90vw; box-shadow: var(--shadow); font-weight: 700; }
  .toast.error { border-color: var(--coral); }
  .toast.success { border-color: var(--mint); }

  .footer { margin-top: auto; padding-top: 20px; text-align: center; color: var(--paper); font-size: 12px; opacity: .85; }
  a { color: var(--accent); font-weight: 700; }

  .small { font-size: 13px; }
  .center-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  hr { border: none; border-top: 2px solid var(--line); margin: 16px 0; }
  .panel.dark hr, .panel.pink hr, .panel.purple hr, .panel.blue hr { border-top-color: rgba(255,248,231,.25); }

  .vote-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  details { background: var(--paper); border: 3px solid var(--line-strong); border-radius: 10px; padding: 10px 14px; margin-top: 8px; box-shadow: 3px 3px 0 var(--line-strong); }
  details summary { cursor: pointer; font-weight: 700; }
  details[open] summary { margin-bottom: 10px; }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-tile {
    background: var(--paper); border: 3px solid var(--line-strong); border-radius: 12px;
    padding: 14px; text-align: left; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .mode-tile:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 0 var(--line-strong); }
  .mode-tile.pink { background: var(--pink); color: var(--paper); }
  .mode-tile.purple { background: var(--purple); color: var(--paper); }
  .mode-tile.blue { background: var(--blue); color: var(--paper); }
  .mode-tile.mint { background: var(--mint); color: var(--ink); }
  .mode-tile.accent { background: var(--accent); color: var(--ink); }
  .mode-tile.coral { background: var(--coral); color: var(--paper); }
  .mode-tile .mode-name { font-family: "Bagel Fat One"; font-size: 20px; line-height: 1.05; text-transform: uppercase; }
  .mode-tile .mode-desc { font-size: 12px; margin-top: 4px; opacity: .9; line-height: 1.35; }
  .mode-tile .difficulty { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; margin-top: 6px; font-weight: 800; }

  .single-card-wrap { max-width: 280px; margin: 0 auto; }
  .single-card-wrap.rotated { transform: rotate(-2deg); }

  .hand { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hand .card-mini { font-size: 12px; }
  .hand .card-mini .actor-name { font-size: 14px; }
  .hand .card-mini .film-title { font-size: 11px; }
  .hand .card-mini .poster-wrap { aspect-ratio: 3/4; }
  .hand .card-mini.selected { box-shadow: 0 0 0 4px var(--accent), 4px 4px 0 0 var(--line-strong); }

  .named-films { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .named-films .film-chip { background: var(--paper); border: 2px solid var(--line-strong); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-family: "Fraunces"; font-style: italic; font-weight: 800; box-shadow: 2px 2px 0 var(--line-strong); }

  .chain-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .chain-list .step { background: var(--paper); border: 2px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .chain-list .step.movie { font-family: "Fraunces"; font-style: italic; font-weight: 800; }

  /* responsive */
  @media (max-width: 380px) {
    h1 { font-size: 44px; }
    h1.small { font-size: 32px; }
    h2 { font-size: 26px; }
    .roomcode { font-size: 52px; }
    .timer { font-size: 64px; }
    .mode-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ============================================================
   CINEMANIA  —  five-mode movie party game, peer-to-peer
   ============================================================ */

// Immediate "script ran" indicator (replaced once screenHome renders).
(() => {
  const a = document.getElementById('app');
  if (a) a.innerHTML = '<div style="background:#fff;color:#000;padding:16px;border-radius:12px;margin:16px;font-family:system-ui;">Loading Cinemania…</div>';
})();

// Visible error reporter — surfaces any runtime crash to the screen.
window.addEventListener('error', (e) => {
  try {
    const root = document.getElementById('app') || document.body;
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#000;border:3px solid red;border-radius:12px;padding:14px;margin:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;';
    box.textContent = 'JS error: ' + (e.message || e.error || 'unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '');
    root.prepend(box);
  } catch {}
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('Unhandled rejection', e.reason);
});

// Safe localStorage (some sandboxed iframes throw on access)
const SAFE_LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const APP = document.getElementById('app');
const TOAST_ROOT = document.getElementById('toast-root');
const PEER_PREFIX = 'cinemania-room-';
const ROOM_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const ROOM_LEN = 6; // 32^6 ≈ 1 billion — practically unguessable

// Per-peer rate limiter on the host. Discards spammy messages.
const RATE = { lastReset: Date.now(), counts: {} };
function rateOk(peerId) {
  const now = Date.now();
  if (now - RATE.lastReset > 1000) { RATE.counts = {}; RATE.lastReset = now; }
  RATE.counts[peerId] = (RATE.counts[peerId] || 0) + 1;
  return RATE.counts[peerId] <= 20;
}

const local = {
  role: null,
  name: SAFE_LS.get('cine_name') || '',
  myId: null,
  roomCode: null,
  peer: null,
  connections: {},
  state: null,
  timerInterval: null,
};
// Clear any leftover TMDb key from earlier versions.
try { localStorage.removeItem('cine_tmdb_key'); } catch {}

// Built-in curated deck — works with zero setup. Each card tagged with year,
// actor birth year, genres, and oscar status (Best Picture nom or acting nom).
const BUILTIN_DECK = [
  { actor: 'Audrey Hepburn', film: 'Breakfast at Tiffany\'s', year: 1961, actorBorn: 1929, genres: ["comedy","romance","drama"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/79xm4gXw4l7A5D0XukUOJRocFYQ.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/hwPHPRz7YqmcRAlvhag5VPeoaoC.jpg' },
  { actor: 'Marilyn Monroe', film: 'Some Like It Hot', year: 1959, actorBorn: 1926, genres: ["comedy","romance","crime"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/hVIKyTK13AvOGv7ICmJjK44DTzp.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/vcp6rHL2sZWdlJQDEWsEe0jAAe1.jpg' },
  { actor: 'Marlon Brando', film: 'The Godfather', year: 1972, actorBorn: 1924, genres: ["drama","crime"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/3bhkrj58Vtu7enYsRolD1fZdja1.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/eEHCjqKMWSvQU4bmwhLMsg4RtEr.jpg' },
  { actor: 'Humphrey Bogart', film: 'Casablanca', year: 1942, actorBorn: 1899, genres: ["drama","romance"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/lGCEKlJo2CnWydQj7aamY7s1S7Q.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/4pk2VbOb2td7iBZyir6Ji46HH4N.jpg' },
  { actor: 'James Stewart', film: 'Rear Window', year: 1954, actorBorn: 1908, genres: ["thriller","mystery","drama"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/ILVF0eJxHMddjxeQhswFtpMtqx.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/jam9DRhOuKomlr0vUXTamPoxPdk.jpg' },
  { actor: 'Cary Grant', film: 'North by Northwest', year: 1959, actorBorn: 1904, genres: ["thriller","adventure"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/kNOFPQrel9YFCVzI0DF8FnCEpCw.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/rUaQTKw7hNcEvZyFaahIpqiiiWv.jpg' },
  { actor: 'Gregory Peck', film: 'Cape Fear', year: 1991, actorBorn: 1916, genres: ["drama","crime","thriller"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/meJZAAuVcjic2ipvbOPz5UlE4P9.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/2Ojm5IwpTF5qdMTjEmdBh8UZM6K.jpg' },
  { actor: 'Sidney Poitier', film: 'The Jackal', year: 1997, actorBorn: 1927, genres: ["action","crime","thriller"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/oXF26QmDEaRaH9Fbhs3NXtcnryx.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/fhMiCe3ScxBGKEX6Y6flEJm7iHd.jpg' },
  { actor: 'Julie Andrews', film: 'Despicable Me', year: 2010, actorBorn: 1935, genres: ["animation","comedy","crime"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/b1BT309QWjtFUlJPLmXmrcHOWEL.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/kTXM2KfsXh2vSav0s9vaDKfs4lR.jpg' },
  { actor: 'Sean Connery', film: 'Indiana Jones and the Last Crusade', year: 1989, actorBorn: 1930, genres: ["adventure","action"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/sizg1AU8f8JDZX4QIgE4pjUMBvx.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/hbB676mW62gjsh0f51ICYE11niG.jpg' },
  { actor: 'Steve McQueen', film: 'The Great Escape', year: 1963, actorBorn: 1930, genres: ["adventure","drama","war"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/gBH4H8UMFxl139HaLz6lRuvsel8.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/mhHk4NRPXEJLL0SySheXZAArp5w.jpg' },
  { actor: 'Elizabeth Taylor', film: 'The Flintstones', year: 1994, actorBorn: 1932, genres: ["fantasy","comedy","family"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/k7gkf5Wa8YZ9iyEOylBMfw9pnkp.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/6r5yjGdvRvMoWQy7W0CYrkbLSNZ.jpg' },
  { actor: 'Jack Nicholson', film: 'The Shining', year: 1980, actorBorn: 1937, genres: ["horror","thriller"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/uAR0AWqhQL1hQa69UDEbb2rE5Wx.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/hBHcQIEa6P48HQAlLZkh0eKSSkG.jpg' },
  { actor: 'Robert De Niro', film: 'Joker', year: 2019, actorBorn: 1943, genres: ["crime","thriller","drama"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/cT8htcckIuyI1Lqwt1CvD02ynTh.jpg' },
  { actor: 'Al Pacino', film: 'The Godfather', year: 1972, actorBorn: 1940, genres: ["drama","crime"], oscar: false, poster: 'https://image.tmdb.org/t/p/w342/3bhkrj58Vtu7enYsRolD1fZdja1.jpg', actorPhoto: 'https://image.tmdb.org/t/p/w185/m8HAAjq1T75JypKk0v1FFQn4ysZ.jpg' },

// Filter presets — applied to the built-in deck before each game.
const PRESETS = {
  all:           { label: 'Full deck (all cards)',         filter: () => true },
  '2010s':       { label: 'The 2010s (2010–2019)',         filter: c => c.year >= 2010 && c.year <= 2019 },
  modern:        { label: 'Modern era (2000+)',            filter: c => c.year >= 2000 },
  recent:        { label: 'Last 5 years',                  filter: c => c.year >= 2019 },
  comedy:        { label: 'Comedy night',                  filter: c => (c.genres || []).includes('comedy') },
  action:        { label: 'Action movies',                 filter: c => (c.genres || []).includes('action') },
  drama:         { label: 'Dramas',                        filter: c => (c.genres || []).includes('drama') },
  horror:        { label: 'Horror & thrillers',            filter: c => (c.genres || []).some(g => ['horror','thriller'].includes(g)) },
  romance:       { label: 'Romance',                       filter: c => (c.genres || []).includes('romance') },
  scifi:         { label: 'Sci-fi & fantasy',              filter: c => (c.genres || []).some(g => ['sci-fi','fantasy'].includes(g)) },
  modern_actors: { label: 'Actors born 1960 or later',     filter: c => c.actorBorn >= 1960 },
  young_actors:  { label: 'Actors born 1980 or later',     filter: c => c.actorBorn >= 1980 },
};

function deckForPreset(presetId) {
  const preset = PRESETS[presetId] || PRESETS.all;
  return BUILTIN_DECK.filter(preset.filter);
}

// Get hints for an actor — returns { extraFilms: [...], coStars: [...] }
function getHintsForActor(actorName) {
  if (!actorName) return null;
  // Direct lookup
  if (ACTOR_HINTS[actorName]) return ACTOR_HINTS[actorName];
  // Try case-insensitive match
  const key = Object.keys(ACTOR_HINTS).find(k => k.toLowerCase() === actorName.toLowerCase());
  if (key) return ACTOR_HINTS[key];
  // Fallback: scan BUILTIN_DECK for films featuring this actor
  const otherFilms = BUILTIN_DECK.filter(c => c.actor === actorName).map(c => c.film);
  // Find co-stars by genre/year proximity
  const actorEntry = BUILTIN_DECK.find(c => c.actor === actorName);
  let coStarList = [];
  if (actorEntry) {
    coStarList = BUILTIN_DECK
      .filter(c => c.actor !== actorName && Math.abs(c.year - actorEntry.year) <= 10)
      .slice(0, 10)
      .map(c => c.actor);
  }
  return otherFilms.length || coStarList.length ? { extraFilms: otherFilms, coStars: coStarList } : null;
}

const CARD_GRADIENTS = [
  'linear-gradient(135deg, #FF006E, #8338EC)',
  'linear-gradient(135deg, #3A86FF, #06D6A0)',
  'linear-gradient(135deg, #FB5607, #FFBE0B)',
  'linear-gradient(135deg, #8338EC, #3A86FF)',
  'linear-gradient(135deg, #EF476F, #FFBE0B)',
  'linear-gradient(135deg, #06D6A0, #3A86FF)',
];
function gradientFor(seed) {
  let h = 0;
  const s = String(seed || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return CARD_GRADIENTS[Math.abs(h) % CARD_GRADIENTS.length];
}

/* ---------- helpers ---------- */
function randomRoom() {
  let s = '';
  for (let i = 0; i < ROOM_LEN; i++) s += ROOM_ALPHABET[Math.floor(Math.random() * ROOM_ALPHABET.length)];
  return s;
}
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return e;
}
function toast(msg, kind = '') {
  const t = el('div', { class: 'toast ' + kind }, msg);
  TOAST_ROOT.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function render(node) {
  APP.innerHTML = '';
  APP.appendChild(node);
}
function fmtTime(secs) {
  if (secs < 0) secs = 0;
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function copy(text) {
  navigator.clipboard?.writeText(text).then(
    () => toast('Copied', 'success'),
    () => toast('Copy failed')
  );
}
function playerName(id) {
  return (local.state?.players.find(p => p.id === id) || {}).name || 'Player';
}
function activePlayer() {
  const ms = local.state.modeState || {};
  if (ms.activeIdx == null) return null;
  const alive = local.state.players.filter(p => !(ms.eliminated || []).includes(p.id));
  return alive[ms.activeIdx % alive.length] || null;
}
function alivePlayers() {
  const elim = local.state.modeState?.eliminated || [];
  return local.state.players.filter(p => !elim.includes(p.id));
}
function isMe(id) { return id === local.myId; }

// ICE server config for NAT traversal.
const PEER_CONFIG = {
  debug: 0,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
    ]
  },
};

function startPeer(id, asHost) {
  local.peer = new Peer(id, PEER_CONFIG);

  local.peer.on('open', (openId) => {
    console.log('Peer open:', openId);
    if (asHost) renderHostLobby();
  });
  local.peer.on('disconnected', () => {
    console.warn('Peer disconnected from signaling server, reconnecting…');
    if (!local.peer.destroyed) {
      try { local.peer.reconnect(); } catch (e) { console.error('Reconnect failed', e); }
    }
  });
  local.peer.on('error', (err) => {
    console.error('Peer error', err);
    if (err.type === 'unavailable-id') { toast('Room already exists — try a different code', 'error'); screenHome(); }
    else if (err.type === 'peer-unavailable') { /* handled in joinAsGuest */ }
    else if (err.type === 'network') { toast('Network error — check your internet', 'error'); }
    else if (err.type === 'server-error') { toast('Connection server is temporarily down', 'error'); }
    else if (err.type !== 'peer-unavailable') toast('Connection issue — please retry', 'error');
  });

  if (asHost) {
    local.peer.on('connection', (conn) => {
      conn.on('open', () => {
        local.connections[conn.peer] = conn;
        conn.on('data', (msg) => hostHandleGuestMessage(conn.peer, msg));
        conn.on('close', () => {
          delete local.connections[conn.peer];
          local.state.players = local.state.players.filter(p => p.id !== conn.peer);
          broadcastState();
          renderForPhase();
        });
        conn.on('error', (e) => {
          console.error('Host conn error to', conn.peer, e);
        });
      });
    });
  }
}

function joinAsGuest(code) {
  local.role = 'guest';
  local.roomCode = code;

  let attempts = 0;
  const MAX_ATTEMPTS = 4;
  const RETRY_DELAY = 2500;
  let cancelled = false;

  function showJoiningScreen() {
    render(el('div', { class: 'center-stage center' }, [
      el('h1', { class: 'small' }, 'Joining…'),
      el('div', { class: 'tagline' }, 'Looking for room ' + code),
      el('div', { class: 'panel', style: { marginTop: '12px' } }, [
        el('div', { class: 'small center muted' }, 'This can take a few seconds.'),
      ]),
      el('button', { class: 'secondary', style: { marginTop: '14px' }, onclick: () => {
        cancelled = true;
        cleanup();
        screenJoinRoom();
      }}, 'Cancel'),
    ]));
  }

  function cleanup() {
    try { if (local.peer && !local.peer.destroyed) local.peer.destroy(); } catch (e) {}
    local.peer = null;
    local.connections = {};
  }

  function attemptConnect() {
    if (cancelled) return;
    attempts++;
    console.log('Join attempt', attempts);

    // Create a fresh peer for each attempt (PeerJS caches failed lookups)
    cleanup();
    const guestId = PEER_PREFIX + 'guest-' + Math.random().toString(36).slice(2, 10);
    local.myId = guestId;
    local.peer = new Peer(guestId, PEER_CONFIG);

    let connected = false;
    let timeoutId = null;

    local.peer.on('open', () => {
      if (cancelled || connected) return;
      const conn = local.peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
      local.connections.host = conn;

      timeoutId = setTimeout(() => {
        if (!connected && !cancelled) {
          console.warn('Attempt', attempts, 'timed out');
          conn.close();
          retry();
        }
      }, 10000);

      conn.on('open', () => {
        if (cancelled) return;
        connected = true;
        if (timeoutId) clearTimeout(timeoutId);
        console.log('Connected to host');
        conn.send({ type: 'hello', name: local.name, id: local.myId });
      });

      conn.on('data', (msg) => guestHandleHostMessage(msg));

      conn.on('close', () => {
        if (connected && !cancelled) {
          toast('Lost connection to host', 'error');
          screenHome();
        }
      });

      conn.on('error', (e) => {
        console.error('Connection error', e);
        if (!connected && !cancelled) {
          if (timeoutId) clearTimeout(timeoutId);
          retry();
        }
      });
    });

    local.peer.on('error', (err) => {
      console.error('Peer error during join:', err.type);
      if (connected || cancelled) return;
      if (timeoutId) clearTimeout(timeoutId);
      if (err.type === 'peer-unavailable') {
        retry();
      } else if (err.type === 'unavailable-id') {
        // Our random guest ID collided (virtually impossible but handle it)
        retry();
      } else {
        retry();
      }
    });
  }

  function retry() {
    if (cancelled) return;
    if (attempts >= MAX_ATTEMPTS) {
      toast('Could not find that room. Make sure the host has the game open.', 'error');
      cleanup();
      screenJoinRoom();
    } else {
      setTimeout(attemptConnect, RETRY_DELAY);
    }
  }

  showJoiningScreen();
  attemptConnect();
}

/* ---- per-recipient state filtering (hide private hands) ---- */
function personalizeState(recipientId) {
  const s = local.state;
  if (s.mode !== 'take_six' || !s.modeState?.hands) return s;
  // Clone and redact other players' hands
  const copy = JSON.parse(JSON.stringify(s));
  for (const pid of Object.keys(copy.modeState.hands)) {
    if (pid !== recipientId) {
      copy.modeState.hands[pid] = copy.modeState.hands[pid].map(() => ({ hidden: true }));
    }
  }
  return copy;
}

function broadcastState() {
  if (local.role !== 'host') return;
  for (const [peerId, conn] of Object.entries(local.connections)) {
    try { conn.send({ type: 'state', state: personalizeState(peerId) }); } catch (e) { /* ignore */ }
  }
}
function send(msg) { local.connections.host?.send(msg); }

/* ---- Host message handler ---- */
function hostHandleGuestMessage(peerId, msg) {
  if (!msg || typeof msg !== 'object') return;
  if (!rateOk(peerId)) return; // drop spammy peers
  switch (msg.type) {
    case 'hello': {
      if (!local.state.players.find(p => p.id === peerId)) {
        local.state.players.push({ id: peerId, name: (msg.name || 'Player').slice(0, 20), score: 0 });
      }
      broadcastState();
      renderForPhase();
      break;
    }
    // SIX DEGREES & TAKE SIX
    case 'submit_chain':
      gameSubmitChain(peerId, msg);
      break;
    case 'vote':
      gameVote(peerId, msg.value);
      break;
    // FILMOGRAPHY
    case 'name_film':
      gameNameFilm(peerId, msg.film);
      break;
    case 'stumped':
      if (local.state.mode === 'filmography') gameStumped(peerId);
      else if (local.state.mode === 'movie_actor') movieActorStumped(peerId);
      break;
    case 'challenge_film':
      gameChallengeFilm(peerId, msg.targetFilm);
      break;
    // HEAD ON
    case 'head_on_got_it':
      gameHeadOnGotIt(peerId);
      break;
    case 'head_on_pass':
      gameHeadOnPass(peerId);
      break;
    case 'head_on_ready':
      gameHeadOnReady(peerId);
      break;
    // MOVIE/ACTOR
    case 'name_link':
      gameNameLink(peerId, msg.value);
      break;
    // TAKE SIX
    case 'play_card':
      gameTakeSixPlay(peerId, msg);
      break;
    case 'swap':
      gameTakeSixSwap(peerId, msg.cardIdx);
      break;
    // CUSTOM
    case 'score_adjust':
      gameCustomScoreAdjust(peerId, msg.target, msg.delta);
      break;
    case 'next_card_request':
      gameDrawNextCard();
      break;
    // SKIP CARD (any mode)
    case 'skip_card':
      gameSkipCard(peerId);
      break;
  }
}

/* ---- Guest message handler ---- */
function guestHandleHostMessage(msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'state') {
    local.state = msg.state;
    renderForPhase();
  }
}

/* ============================================================
   DECK LOADING
   ============================================================ */

async function buildDeck() {
  const presetId = (local.state && local.state.preset) || 'all';
  let source = deckForPreset(presetId);
  if (source.length < 4) {
    toast('Preset too narrow — using full deck', 'error');
    source = BUILTIN_DECK;
  }
  const cards = source.map(c => ({ actor: c.actor, film: c.film }));
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

/* ============================================================
   GAME ORCHESTRATION
   ============================================================ */

async function startGame(mode) {
  local.state.mode = mode;
  local.state.modeState = {};
  for (const p of local.state.players) p.score = 0;
  local.state.history = [];
  local.state.round = 0;
  local.state.submission = null;
  local.state.currentCard = null;
  local.state.currentPair = null;

  // Load deck once per game
  try {
    render(el('div', { class: 'center-stage center' }, [
      el('h1', { class: 'small' }, 'Shuffling…'),
      el('div', { class: 'tagline' }, PRESETS[local.state.preset]?.label || 'Building deck'),
    ]));
    const deck = await buildDeck();
    if (deck.length < (mode === 'take_six' ? 6 * local.state.players.length + 4 : 4)) {
      toast('Not enough cards in this preset', 'error');
      local.state.phase = 'lobby'; broadcastState(); renderForPhase(); return;
    }
    local.state.deck = deck;
    local.state.drawn = [];
  } catch (e) {
    console.error(e);
    toast('Deck error: ' + e.message, 'error');
    local.state.phase = 'lobby'; broadcastState(); renderForPhase(); return;
  }

  // Mode-specific setup
  switch (mode) {
    case 'six_degrees':  return startSixDegrees();
    case 'filmography':  return startFilmography();
    case 'head_on':      return startHeadOn();
    case 'movie_actor':  return startMovieActor();
    case 'take_six':     return startTakeSix();
    case 'custom':       return startCustom();
  }
}

function drawCard() {
  if (local.state.deck.length === 0) return null;
  const c = local.state.deck.shift();
  local.state.drawn.push(c);
  return c;
}
function drawPair() {
  return [drawCard(), drawCard()].filter(Boolean);
}

function endGame() {
  local.state.phase = 'game_over';
  broadcastState();
  renderForPhase();
}

/* ============================================================
   MODE: SIX DEGREES
   ============================================================ */
function startSixDegrees() {
  local.state.modeState = {};
  nextSixDegreesRound();
}
function nextSixDegreesRound() {
  if (local.state.round >= local.state.totalRounds || local.state.deck.length < 2) return endGame();
  local.state.round += 1;
  local.state.submission = null;
  local.state.currentPair = drawPair();
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function gameSubmitChain(peerId, msg) {
  if (local.state.mode === 'six_degrees') {
    if (local.state.phase !== 'playing' || local.state.submission) return;
    local.state.submission = { playerId: peerId, chain: msg.chain, degrees: msg.degrees, name: playerName(peerId), votes: {} };
    local.state.phase = 'voting';
    broadcastState(); renderForPhase();
  } else if (local.state.mode === 'take_six') {
    gameTakeSixPlay(peerId, msg);
  }
}
function gameVote(peerId, value) {
  if (!local.state.submission) return;
  const s = local.state.submission;
  if (peerId === s.playerId) return; // submitter can't vote
  s.votes[peerId] = value ? 'yes' : 'no';
  const eligible = local.state.players.filter(p => p.id !== s.playerId);
  const yes = eligible.filter(p => s.votes[p.id] === 'yes').length;
  const no  = eligible.filter(p => s.votes[p.id] === 'no').length;
  if (eligible.length === 0) {
    return resolveSubmission(true);
  }
  const majority = Math.floor(eligible.length / 2) + 1;
  if (yes >= majority) return resolveSubmission(true);
  if (no >= majority) return resolveSubmission(false);
  broadcastState(); renderForPhase();
}
function resolveSubmission(accepted) {
  const s = local.state.submission;
  if (local.state.mode === 'six_degrees') {
    if (accepted) {
      const p = local.state.players.find(x => x.id === s.playerId);
      if (p) p.score += 1;
      local.state.history.push({ round: local.state.round, pair: local.state.currentPair, winner: s.name, degrees: s.degrees, chain: s.chain, accepted: true });
      toast(`${s.name} +1 (${s.degrees}°)`, 'success');
    } else {
      local.state.history.push({ round: local.state.round, pair: local.state.currentPair, winner: null, degrees: null, chain: s.chain, accepted: false });
      toast(`Chain rejected`, '');
    }
    local.state.phase = 'round_end';
    broadcastState(); renderForPhase();
    setTimeout(() => { if (local.role === 'host') nextSixDegreesRound(); }, 4200);
  } else if (local.state.mode === 'take_six') {
    resolveTakeSixSubmission(accepted);
  }
}

/* ============================================================
   MODE: FILMOGRAPHY
   ============================================================ */
function startFilmography() {
  local.state.modeState = {
    namedFilms: [],
    eliminated: [],
    activeIdx: 0,
    finalPlayer: null,    // when 1 player remains, they must name one more
    pendingFinalConfirm: false,
  };
  nextFilmographyRound();
}
function nextFilmographyRound() {
  if (local.state.round >= local.state.totalRounds || local.state.deck.length < 1) return endGame();
  local.state.round += 1;
  local.state.currentCard = drawCard();
  local.state.modeState.namedFilms = [local.state.currentCard.film];
  local.state.modeState.eliminated = [];
  local.state.modeState.activeIdx = 0;
  local.state.modeState.finalPlayer = null;
  local.state.modeState.pendingFinalConfirm = false;
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function filmographyAdvance() {
  const ms = local.state.modeState;
  const alive = alivePlayers();
  if (alive.length === 1 && !ms.pendingFinalConfirm) {
    ms.pendingFinalConfirm = true;
    ms.finalPlayer = alive[0].id;
    ms.activeIdx = 0; // alive index
  } else if (alive.length === 0) {
    // Everyone stumped — wash
    finishFilmographyRound(null);
    return;
  } else {
    ms.activeIdx = (ms.activeIdx + 1) % alive.length;
  }
  broadcastState(); renderForPhase();
}
function normalizeFilmTitle(t) {
  return (t || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\b(the|a|an)\b/g, '').replace(/\s+/g, ' ').trim();
}
function isValidFilmForActor(actorName, filmTitle) {
  const filmography = FILMOGRAPHY[actorName];
  if (!filmography) return true; // no data = allow
  const norm = normalizeFilmTitle(filmTitle);
  return filmography.some(f => normalizeFilmTitle(f) === norm);
}
function gameNameFilm(peerId, film) {
  if (local.state.mode !== 'filmography') return;
  if (local.state.phase !== 'playing') return;
  const ms = local.state.modeState;
  const ap = activePlayer();
  if (!ap || ap.id !== peerId) return;
  const cleaned = (film || '').trim();
  if (!cleaned) return;
  if (ms.namedFilms.some(f => normalizeFilmTitle(f) === normalizeFilmTitle(cleaned))) {
    toast(`"${cleaned}" was already named — try another`, 'error');
    return;
  }
  const actor = local.state.currentCard ? local.state.currentCard.actor : null;
  if (actor && !isValidFilmForActor(actor, cleaned)) {
    toast(`"${cleaned}" isn't in our database for ${actor}. Try another title!`, 'error');
    return;
  }
  ms.namedFilms.push(cleaned);
  if (ms.pendingFinalConfirm && peerId === ms.finalPlayer) {
    finishFilmographyRound(peerId);
    return;
  }
  filmographyAdvance();
}
function gameStumped(peerId) {
  if (local.state.mode !== 'filmography') return;
  const ms = local.state.modeState;
  const ap = activePlayer();
  if (!ap || ap.id !== peerId) return;
  if (ms.pendingFinalConfirm && peerId === ms.finalPlayer) {
    // Final player failed — round ends without winner
    finishFilmographyRound(null);
    return;
  }
  ms.eliminated.push(peerId);
  toast(`${playerName(peerId)} is out`, '');
  // After elimination, activeIdx points to the next alive player (now alivePlayers shrank)
  // We don't increment because the removed player's slot effectively "shifts" the next.
  // Implement by snapping activeIdx to a safe value
  const alive = alivePlayers();
  if (alive.length === 0) return finishFilmographyRound(null);
  ms.activeIdx = ms.activeIdx % alive.length;
  if (alive.length === 1) {
    ms.pendingFinalConfirm = true;
    ms.finalPlayer = alive[0].id;
    ms.activeIdx = 0;
  }
  broadcastState(); renderForPhase();
}
function gameChallengeFilm(peerId, targetFilm) {
  if (local.state.mode !== 'filmography') return;
  // Honor-system: just remove the named film and eliminate the submitter who named it last
  const ms = local.state.modeState;
  if (ms.namedFilms.length < 2) return;
  // Pop the last named film
  ms.namedFilms.pop();
  // Eliminate the previous active player (the one who just named it)
  // For simplicity: eliminate last-named player. We don't track who named each film, so:
  // We'll just eliminate the previously-active player (one step back).
  const alive = alivePlayers();
  if (alive.length === 0) return;
  const prevIdx = (ms.activeIdx - 1 + alive.length) % alive.length;
  const offender = alive[prevIdx];
  if (offender) ms.eliminated.push(offender.id);
  toast(`Challenge: ${playerName(offender?.id)} eliminated`, 'error');
  const newAlive = alivePlayers();
  if (newAlive.length <= 1) {
    if (newAlive.length === 1) {
      ms.pendingFinalConfirm = true;
      ms.finalPlayer = newAlive[0].id;
      ms.activeIdx = 0;
    } else {
      return finishFilmographyRound(null);
    }
  } else {
    ms.activeIdx = ms.activeIdx % newAlive.length;
  }
  broadcastState(); renderForPhase();
}
function finishFilmographyRound(winnerId) {
  if (winnerId) {
    const w = local.state.players.find(p => p.id === winnerId);
    if (w) w.score += 1;
    toast(`${playerName(winnerId)} wins the round!`, 'success');
  } else {
    toast(`Round ended — no winner`, '');
  }
  local.state.history.push({
    round: local.state.round, mode: 'filmography',
    card: local.state.currentCard, namedFilms: local.state.modeState.namedFilms,
    winner: winnerId ? playerName(winnerId) : null,
  });
  local.state.phase = 'round_end';
  broadcastState(); renderForPhase();
  setTimeout(() => { if (local.role === 'host') nextFilmographyRound(); }, 4500);
}

/* ============================================================
   MODE: HEAD ON
   ============================================================ */
function startHeadOn() {
  local.state.modeState = {
    holderIdx: 0,
    timerEndsAt: null,
    correct: 0,
    passes: 0,
    ready: false,
    turnsTaken: 0,
  };
  startHeadOnTurn();
}
function startHeadOnTurn() {
  const ms = local.state.modeState;
  if (ms.turnsTaken >= local.state.players.length * Math.max(1, Math.floor(local.state.totalRounds / local.state.players.length || 1)) && ms.turnsTaken >= local.state.totalRounds) {
    return endGame();
  }
  if (local.state.deck.length < 1) return endGame();
  ms.ready = false;
  ms.correct = 0;
  ms.passes = 0;
  ms.timerEndsAt = null;
  local.state.currentCard = drawCard();
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function gameHeadOnReady(peerId) {
  const ms = local.state.modeState;
  const holder = local.state.players[ms.holderIdx];
  if (!holder || holder.id !== peerId) return;
  ms.ready = true;
  ms.timerEndsAt = Date.now() + 60000;
  broadcastState(); renderForPhase();
  if (local.timerInterval) clearInterval(local.timerInterval);
  local.timerInterval = setInterval(() => {
    if (local.state.mode !== 'head_on') { clearInterval(local.timerInterval); return; }
    const remaining = ms.timerEndsAt - Date.now();
    if (remaining <= 0) {
      clearInterval(local.timerInterval);
      finishHeadOnTurn();
    } else {
      broadcastState(); renderForPhase();
    }
  }, 1000);
}
function gameHeadOnGotIt(peerId) {
  const ms = local.state.modeState;
  const holder = local.state.players[ms.holderIdx];
  if (!holder || holder.id !== peerId || !ms.ready) return;
  ms.correct += 1;
  // Next card
  if (local.state.deck.length > 0) {
    local.state.currentCard = drawCard();
  } else {
    finishHeadOnTurn();
    return;
  }
  broadcastState(); renderForPhase();
}
function gameHeadOnPass(peerId) {
  const ms = local.state.modeState;
  const holder = local.state.players[ms.holderIdx];
  if (!holder || holder.id !== peerId || !ms.ready) return;
  ms.passes += 1;
  if (local.state.deck.length > 0) {
    local.state.currentCard = drawCard();
  } else {
    finishHeadOnTurn();
    return;
  }
  broadcastState(); renderForPhase();
}
function finishHeadOnTurn() {
  const ms = local.state.modeState;
  const holder = local.state.players[ms.holderIdx];
  const net = ms.correct - ms.passes;
  if (holder) {
    const p = local.state.players.find(x => x.id === holder.id);
    if (p) p.score += net;
  }
  local.state.history.push({
    round: local.state.round + 1, mode: 'head_on',
    holder: holder?.name, correct: ms.correct, passes: ms.passes, net,
  });
  ms.turnsTaken += 1;
  ms.holderIdx = (ms.holderIdx + 1) % local.state.players.length;
  local.state.round += 1;
  local.state.phase = 'round_end';
  broadcastState(); renderForPhase();
  setTimeout(() => { if (local.role === 'host') startHeadOnTurn(); }, 4500);
}

/* ============================================================
   MODE: MOVIE / ACTOR
   ============================================================ */
function startMovieActor() {
  local.state.modeState = {
    eliminated: [],
    activeIdx: 0,
    chain: [],   // [{type, value, by}]
    expecting: 'actor',  // first named card is a movie; next is actor
  };
  nextMovieActorRound();
}
function nextMovieActorRound() {
  if (alivePlayers().length <= 1 && local.state.modeState.chain.length > 0) {
    const winner = alivePlayers()[0];
    if (winner) local.state.players.find(p => p.id === winner.id).score += 1;
    toast(`${winner?.name || '—'} wins the round!`, 'success');
    local.state.history.push({ round: local.state.round, mode: 'movie_actor', chain: [...local.state.modeState.chain], winner: winner?.name });
    if (local.state.round >= local.state.totalRounds) return endGame();
    // Reset for next round
  }
  if (local.state.round >= local.state.totalRounds || local.state.deck.length < 1) return endGame();
  local.state.round += 1;
  local.state.currentCard = drawCard();
  local.state.modeState.eliminated = [];
  local.state.modeState.activeIdx = 0;
  local.state.modeState.chain = [
    { type: 'movie', value: local.state.currentCard.film, by: 'deck' },
  ];
  local.state.modeState.expecting = 'actor';
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function gameNameLink(peerId, value) {
  if (local.state.mode !== 'movie_actor') return;
  const ap = activePlayer();
  if (!ap || ap.id !== peerId) return;
  const cleaned = (value || '').trim();
  if (!cleaned) return;
  const ms = local.state.modeState;
  // No repeats
  if (ms.chain.some(s => s.value.toLowerCase() === cleaned.toLowerCase())) {
    toast(`"${cleaned}" already in chain`, 'error');
    return;
  }
  ms.chain.push({ type: ms.expecting, value: cleaned, by: playerName(peerId) });
  ms.expecting = ms.expecting === 'actor' ? 'movie' : 'actor';
  // Advance
  const alive = alivePlayers();
  ms.activeIdx = (ms.activeIdx + 1) % alive.length;
  broadcastState(); renderForPhase();
}
function movieActorStumped(peerId) {
  if (local.state.mode !== 'movie_actor') return;
  const ap = activePlayer();
  if (!ap || ap.id !== peerId) return;
  const ms = local.state.modeState;
  ms.eliminated.push(peerId);
  toast(`${playerName(peerId)} is out`, '');
  const alive = alivePlayers();
  if (alive.length <= 1) {
    if (alive.length === 1) {
      const winner = alive[0];
      const p = local.state.players.find(x => x.id === winner.id);
      if (p) p.score += 1;
      toast(`${winner.name} wins!`, 'success');
      local.state.history.push({ round: local.state.round, mode: 'movie_actor', chain: [...ms.chain], winner: winner.name });
    } else {
      local.state.history.push({ round: local.state.round, mode: 'movie_actor', chain: [...ms.chain], winner: null });
    }
    local.state.phase = 'round_end';
    broadcastState(); renderForPhase();
    setTimeout(() => { if (local.role === 'host') nextMovieActorRound(); }, 4500);
    return;
  }
  ms.activeIdx = ms.activeIdx % alive.length;
  broadcastState(); renderForPhase();
}

/* ============================================================
   MODE: TAKE SIX
   ============================================================ */
function startTakeSix() {
  const hands = {};
  for (const p of local.state.players) {
    hands[p.id] = [];
    for (let i = 0; i < 6; i++) hands[p.id].push(drawCard());
  }
  local.state.modeState = {
    hands,
    anchor: drawCard(),
    activeIdx: 0,
    submission: null,
  };
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function gameTakeSixPlay(peerId, msg) {
  if (local.state.mode !== 'take_six') return;
  if (local.state.phase !== 'playing') return;
  if (local.state.submission) return;
  const ap = activePlayer();
  if (!ap || ap.id !== peerId) return;
  const hand = local.state.modeState.hands[peerId] || [];
  const cardIdx = msg.cardIdx;
  if (cardIdx == null || !hand[cardIdx] || hand[cardIdx].hidden) return;
  local.state.submission = {
    playerId: peerId, name: playerName(peerId),
    cardIdx, card: hand[cardIdx],
    chain: msg.chain || '', degrees: msg.degrees,
    votes: {},
  };
  local.state.phase = 'voting';
  broadcastState(); renderForPhase();
}
function resolveTakeSixSubmission(accepted) {
  const s = local.state.submission;
  const ms = local.state.modeState;
  if (accepted) {
    // Remove card from hand, anchor becomes played card
    ms.hands[s.playerId] = ms.hands[s.playerId].filter((_, i) => i !== s.cardIdx);
    const p = local.state.players.find(x => x.id === s.playerId);
    if (p) p.score += s.degrees; // lower is better
    ms.anchor = s.card;
    toast(`${s.name} played (${s.degrees}°)`, 'success');
    local.state.history.push({ round: local.state.round + 1, mode: 'take_six', winner: s.name, chain: s.chain, degrees: s.degrees, accepted: true });
    if (ms.hands[s.playerId].length === 0) {
      // First to empty hand wins
      toast(`${s.name} sheds the hand — wins!`, 'success');
      return endGame();
    }
  } else {
    // Penalty: draw a card
    if (local.state.deck.length > 0) {
      ms.hands[s.playerId].push(drawCard());
    }
    toast(`Rejected. ${s.name} draws.`, '');
    local.state.history.push({ round: local.state.round + 1, mode: 'take_six', winner: null, chain: s.chain, accepted: false });
  }
  local.state.submission = null;
  // Advance
  const alive = local.state.players;
  ms.activeIdx = (ms.activeIdx + 1) % alive.length;
  local.state.round += 1;
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function gameTakeSixSwap(peerId, cardIdx) {
  if (local.state.mode !== 'take_six') return;
  const ap = activePlayer();
  if (!ap || ap.id !== peerId) return;
  const ms = local.state.modeState;
  const hand = ms.hands[peerId];
  if (!hand[cardIdx] || hand[cardIdx].hidden) return;
  // Discard one, draw two
  hand.splice(cardIdx, 1);
  if (local.state.deck.length >= 2) {
    hand.push(drawCard());
    hand.push(drawCard());
  }
  // Turn advances
  ms.activeIdx = (ms.activeIdx + 1) % local.state.players.length;
  broadcastState(); renderForPhase();
}

/* ============================================================
   MODE: CUSTOM RULES
   ============================================================ */
function startCustom() {
  local.state.modeState = {
    timerEndsAt: null,
  };
  local.state.currentCard = drawCard();
  local.state.round = 1;
  local.state.phase = 'playing';
  broadcastState(); renderForPhase();
}
function gameDrawNextCard() {
  if (local.state.deck.length === 0) return endGame();
  local.state.round += 1;
  local.state.currentCard = drawCard();
  broadcastState(); renderForPhase();
}
function gameCustomScoreAdjust(peerId, targetId, delta) {
  // For Custom mode, anyone can adjust anyone's score (honor system)
  if (local.state.mode !== 'custom') return;
  const t = local.state.players.find(p => p.id === targetId);
  if (!t) return;
  t.score += delta;
  broadcastState(); renderForPhase();
}

// Skip card — draws a new card (costs no points but counts toward round limit)
function gameSkipCard(peerId) {
  if (local.state.phase !== 'playing') return;
  const mode = local.state.mode;
  // Only allow skip in modes where a current card is shown
  if (['filmography', 'head_on', 'movie_actor', 'custom'].includes(mode)) {
    if (local.state.deck.length === 0) {
      toast('No more cards to skip to', 'error');
      return;
    }
    toast(`${playerName(peerId)} skipped the card`, '');
    if (mode === 'filmography') {
      // Reset filmography round state for new card
      local.state.currentCard = drawCard();
      const ms = local.state.modeState;
      ms.namedFilms = [local.state.currentCard.film];
      ms.eliminated = [];
      ms.activeIdx = 0;
      ms.finalPlayer = null;
      ms.pendingFinalConfirm = false;
    } else if (mode === 'head_on') {
      local.state.currentCard = drawCard();
      local.state.modeState.ready = false;
    } else {
      local.state.currentCard = drawCard();
    }
    broadcastState(); renderForPhase();
  } else if (mode === 'six_degrees') {
    if (local.state.deck.length < 2) {
      toast('Not enough cards to skip', 'error');
      return;
    }
    toast(`${playerName(peerId)} skipped the pair`, '');
    local.state.currentPair = drawPair();
    local.state.submission = null;
    broadcastState(); renderForPhase();
  }
}

// Track hint state locally (not synced — each player sees their own hints)
let _hintRevealed = {};
let _hintPanelOpen = {};

function skipHintPanel(actorName) {
  const hintId = actorName || '';
  const hints = getHintsForActor(actorName);
  const revealed = _hintRevealed[hintId];

  const children = [];

  // Skip button
  children.push(el('button', { class: 'ghost', style: { marginBottom: '8px' }, onclick: () => {
    if (local.role === 'host') gameSkipCard(local.myId);
    else send({ type: 'skip_card' });
  }}, '⏭ Skip this card'));

  // Hint buttons
  if (hints) {
    const hintTypes = [
      { key: 'films', label: '💡 Films', cls: 'blue', available: hints.extraFilms && hints.extraFilms.length > 0 },
      { key: 'costars', label: '💡 Co-stars', cls: 'purple', available: hints.coStars && hints.coStars.length > 0 },
      { key: 'director', label: '🎬 Director', cls: 'secondary', available: !!hints.director },
      { key: 'tagline', label: '💬 Tagline', cls: 'secondary', available: !!hints.tagline },
      { key: 'similar', label: '🎥 Similar', cls: 'secondary', available: hints.similarMovies && hints.similarMovies.length > 0 },
    ];
    if (!revealed) {
      children.push(el('div', { class: 'row', style: { flexWrap: 'wrap', gap: '6px' } },
        hintTypes.filter(h => h.available).map(h =>
          el('button', { class: h.cls, style: { fontSize: '12px' }, onclick: () => {
            _hintRevealed[hintId] = h.key;
            renderForPhase();
          }}, h.label)
        )
      ));
    } else {
      let hintContent = null;
      if (revealed === 'films') {
        hintContent = el('div', {}, [
          el('label', {}, 'Other films by ' + actorName),
          el('div', { class: 'named-films', style: { marginTop: '6px' } },
            hints.extraFilms.map(f => el('div', { class: 'film-chip' }, f))
          ),
        ]);
      } else if (revealed === 'costars') {
        hintContent = el('div', {}, [
          el('label', {}, 'Actors who worked with ' + actorName),
          el('div', { class: 'named-films', style: { marginTop: '6px' } },
            hints.coStars.map(name => el('div', { class: 'film-chip' }, name))
          ),
        ]);
      } else if (revealed === 'director') {
        hintContent = el('div', {}, [
          el('label', {}, 'Director'),
          el('div', { style: { marginTop: '6px', fontWeight: '700', fontSize: '15px' } }, hints.director),
        ]);
      } else if (revealed === 'tagline') {
        hintContent = el('div', {}, [
          el('label', {}, 'Movie tagline'),
          el('div', { style: { marginTop: '6px', fontStyle: 'italic', fontSize: '14px' } }, '"' + hints.tagline + '"'),
        ]);
      } else if (revealed === 'similar') {
        hintContent = el('div', {}, [
          el('label', {}, 'Similar movies'),
          el('div', { class: 'named-films', style: { marginTop: '6px' } },
            hints.similarMovies.map(m => el('div', { class: 'film-chip' }, m))
          ),
        ]);
      }
      children.push(el('div', { class: 'panel', style: { marginTop: '8px', padding: '12px' } }, [
        hintContent,
        el('div', { class: 'row', style: { marginTop: '8px', flexWrap: 'wrap', gap: '4px' } },
          hintTypes.filter(h => h.available && h.key !== revealed).map(h =>
            el('button', { class: 'secondary', style: { fontSize: '11px' }, onclick: () => {
              _hintRevealed[hintId] = h.key;
              renderForPhase();
            }}, h.label)
          )
        ),
      ]));
    }
  } else {
    children.push(el('div', { class: 'small muted', style: { marginTop: '4px' } }, 'No hints available for this actor.'));
  }

  const isOpen = _hintPanelOpen[hintId] || !!_hintRevealed[hintId];
  const det = el('details', { style: { marginTop: '10px' } }, [
    el('summary', {}, '🎬 Need help? (Skip or get hints)'),
    el('div', { style: { marginTop: '8px' } }, children),
  ]);
  if (isOpen) det.setAttribute('open', '');
  det.addEventListener('toggle', () => { _hintPanelOpen[hintId] = det.open; });
  return det;
}

function renderForPhase() {
  if (!local.state) return;
  switch (local.state.phase) {
    case 'lobby': return local.role === 'host' ? renderHostLobby() : renderGuestLobby();
    case 'mode_select': return renderModeSelect();
    case 'custom_setup': return renderCustomSetup();
    case 'playing':
    case 'voting':
    case 'round_end':
      switch (local.state.mode) {
        case 'six_degrees': return renderSixDegreesPhase();
        case 'filmography': return renderFilmographyPhase();
        case 'head_on': return renderHeadOnPhase();
        case 'movie_actor': return renderMovieActorPhase();
        case 'take_six': return renderTakeSixPhase();
        case 'custom': return renderCustomPhase();
      }
      break;
    case 'game_over': return renderGameOver();
  }
}

function renderSixDegreesVoting() {

          ]),
    ]),
    skipHintPanel(local.state.currentCard?.actor),
    el('details', { open: true }, [el('summary', {}, 'Scoreboard'), playersList()]),
    footer(),
  ]);
  render(root);
}

/* ============================================================
   RENDER: HEAD ON
   ============================================================ */
function renderHeadOnPhase() {
  if (local.state.phase === 'round_end') return renderRoundEndGeneric('Time!');
  const ms = local.state.modeState;
  const holder = local.state.players[ms.holderIdx];
  const amHolder = holder && holder.id === local.myId;
  const remaining = ms.timerEndsAt ? Math.max(0, Math.ceil((ms.timerEndsAt - Date.now()) / 1000)) : 60;
  const timerCls = 'timer ' + (remaining <= 10 ? 'danger' : (remaining <= 20 ? 'warn' : ''));

  const root = el('div', {}, [
    roundHeader(),
    el('div', { class: 'panel pink center' }, [
      el('h2', { style: { color: 'var(--paper)' } }, amHolder ? 'You\'re the guesser' : (holder ? `${holder.name} is up` : '')),
      el('div', { class: 'tagline' }, amHolder ? 'Hold this phone to your forehead. Friends will give you clues!' : 'Give clues without saying the actor or film title.'),
    ]),
    ms.ready ? el('div', { class: timerCls }, fmtTime(remaining)) : null,
    amHolder && !ms.ready
      ? el('div', { class: 'panel center' }, [
          el('div', { class: 'small muted' }, 'When you\'re holding the phone outward and your friends can see the screen, tap Start.'),
          el('button', { onclick: () => {
            if (local.role === 'host') gameHeadOnReady(local.myId);
            else send({ type: 'head_on_ready' });
          }}, 'Start 60-sec timer'),
        ])
      : null,
    ms.ready && !amHolder
      ? el('div', { class: 'single-card-wrap' }, [cardEl(local.state.currentCard)])
      : null,
    ms.ready && amHolder
      ? el('div', { class: 'panel dark center' }, [
          el('h3', { style: { color: 'var(--paper)' } }, 'Tap when you guess'),
          el('div', { class: 'vote-buttons', style: { marginTop: '12px' } }, [
            el('button', { class: 'good', onclick: () => {
              if (local.role === 'host') gameHeadOnGotIt(local.myId);
              else send({ type: 'head_on_got_it' });
            }}, '✓ Got it!'),
            el('button', { class: 'danger', onclick: () => {
              if (local.role === 'host') gameHeadOnPass(local.myId);
              else send({ type: 'head_on_pass' });
            }}, '✗ Pass'),
          ]),
          el('div', { class: 'small muted', style: { marginTop: '12px' } }, `Correct: ${ms.correct} · Passes: ${ms.passes}`),
        ])
      : null,
    !amHolder ? skipHintPanel(local.state.currentCard?.actor) : null,
    el('details', {}, [el('summary', {}, 'Scoreboard'), playersList()]),
    footer(),
  ]);
  render(root);
}

/* ============================================================
   RENDER: MOVIE / ACTOR
   ============================================================ */
function renderMovieActorPhase() {
  if (local.state.phase === 'round_end') return renderRoundEndGeneric('Round over.');
  const ms = local.state.modeState;
  const ap = activePlayer();
  const myTurn = ap && ap.id === local.myId;
  const expectingLabel = ms.expecting === 'movie' ? 'Name a different film featuring' : 'Name an actor from';
  const lastStep = ms.chain[ms.chain.length - 1];

  const root = el('div', {}, [
    roundHeader(),
    el('div', { class: 'panel purple' }, [
      el('h3', { style: { color: 'var(--paper)' } }, `Chain (${ms.chain.length})`),
      el('div', { class: 'chain-list' }, ms.chain.map(step => el('div', { class: 'step ' + step.type }, [
        el('div', { class: 'small muted', style: { textTransform: 'uppercase', letterSpacing: '.08em' } }, step.type),
        el('div', {}, step.value),
      ]))),
    ]),
    el('div', { class: 'panel' }, [
      el('h3', {}, myTurn ? 'Your turn' : `${ap ? ap.name : '—'}'s turn`),
      el('div', { class: 'small muted' }, `${expectingLabel} ${lastStep ? '"' + lastStep.value + '"' : '...'}.`),
      myTurn
        ? el('div', { style: { marginTop: '12px' } }, [
            el('div', { class: 'field' }, [
              el('label', {}, ms.expecting === 'movie' ? 'Film title' : 'Actor name'),
              el('input', { id: 'ma-input', placeholder: ms.expecting === 'movie' ? 'e.g. Heat' : 'e.g. Al Pacino' }),
            ]),
            el('div', { class: 'row' }, [
              el('button', { class: 'good', onclick: () => {
                const v = document.getElementById('ma-input').value.trim();
                if (!v) return toast('Type a name', 'error');
                if (local.role === 'host') gameNameLink(local.myId, v);
                else send({ type: 'name_link', value: v });
              }}, 'Submit'),
              el('button', { class: 'danger', onclick: () => {
                if (local.role === 'host') movieActorStumped(local.myId);
                else send({ type: 'stumped' });
              }}, "Stumped"),
            ]),
          ])
        : el('div', { class: 'small muted', style: { marginTop: '12px' } }, 'Waiting…'),
    ]),
    skipHintPanel(local.state.currentCard?.actor || ms.chain?.[ms.chain.length - 1]?.value),
    el('details', { open: true }, [el('summary', {}, 'Scoreboard'), playersList()]),
    footer(),
  ]);
  render(root);
}

/* ============================================================
   RENDER: TAKE SIX
   ============================================================ */
function renderTakeSixPhase() {
  if (local.state.phase === 'voting') return renderTakeSixVoting();
  const ms = local.state.modeState;
  const ap = activePlayer();
  const myTurn = ap && ap.id === local.myId;
  const myHand = ms.hands[local.myId] || [];

  const root = el('div', {}, [
    roundHeader(),
    el('div', { class: 'panel' }, [
      el('h3', {}, 'Anchor card'),
      el('div', { class: 'single-card-wrap' }, [cardEl(ms.anchor)]),
    ]),
    el('div', { class: 'panel' }, [
      el('h3', {}, myTurn ? `Your turn — pick a card to play` : `${ap ? ap.name : '—'}'s turn`),
      el('div', { class: 'small muted' }, 'Play a card and state how its actor connects to the anchor card actor via Six Degrees. Lower degrees = lower score (good!). First to empty hand wins.'),
      el('div', { class: 'hand', style: { marginTop: '12px' } }, myHand.map((c, i) => el('div', { class: 'card card-mini', style: { cursor: myTurn ? 'pointer' : 'default' }, onclick: () => {
        if (!myTurn) return;
        local._takeSixSelected = i;
        renderTakeSixPhase();
      }}, [
        el('div', { class: 'poster-wrap' }, [
          c.poster
            ? el('img', { class: 'poster', src: c.poster, alt: c.film })
            : el('div', { class: 'poster-fallback', style: { background: gradientFor(c.actor), fontSize: '20px' } }, c.film || ''),
          c.actorPhoto ? el('img', { class: 'actor-photo', src: c.actorPhoto }) : null,
        ]),
        el('div', { class: 'label-band' }, [
          el('div', { class: 'actor-name' }, c.actor),
          el('div', { class: 'film-title' }, '"' + c.film + '"'),
        ]),
      ]))),
      myTurn && local._takeSixSelected != null && myHand[local._takeSixSelected]
        ? el('div', { style: { marginTop: '14px' } }, [
            el('div', { class: 'field' }, [
              el('label', {}, 'Connection chain'),
              el('textarea', { id: 'ts-chain', placeholder: ms.anchor?.actor + ' → "Film" → Bridge → "Film" → ' + myHand[local._takeSixSelected].actor }),
            ]),
            el('div', { class: 'row' }, [
              el('div', {}, [
                el('label', { class: 'small' }, 'Degrees'),
                el('select', { id: 'ts-degrees' }, [1,2,3,4,5,6].map(n => el('option', { value: n }, n + '°'))),
              ]),
              el('button', { onclick: () => {
                const chain = document.getElementById('ts-chain').value.trim();
                const degrees = parseInt(document.getElementById('ts-degrees').value, 10);
                if (!chain) return toast('Type the chain', 'error');
                const cardIdx = local._takeSixSelected;
                local._takeSixSelected = null;
                if (local.role === 'host') gameTakeSixPlay(local.myId, { cardIdx, chain, degrees });
                else send({ type: 'play_card', cardIdx, chain, degrees });
              }}, 'Play card'),
              el('button', { class: 'danger', onclick: () => {
                const cardIdx = local._takeSixSelected;
                local._takeSixSelected = null;
                if (local.role === 'host') gameTakeSixSwap(local.myId, cardIdx);
                else send({ type: 'swap', cardIdx });
              }}, 'Swap (-1 +2)'),
            ]),
          ])
        : null,
    ]),
    el('details', { open: true }, [el('summary', {}, 'Scoreboard (lower better, hand size in parens)'), el('div', { class: 'scoreboard' }, local.state.players.map(p => {
      const hsize = (ms.hands[p.id] || []).length;
      const isActive = ap && p.id === ap.id;
      return el('div', { class: 'row-line ' + (isActive ? 'active' : '') }, [
        el('div', {}, [p.name, ` `, el('span', { class: 'pill' }, hsize + ' in hand')]),
        el('div', { style: { fontFamily: '"Bagel Fat One"', fontSize: '20px' } }, String(p.score)),
      ]);
    }))]),
    footer(),
  ]);
  render(root);
}
function renderTakeSixVoting() {
  const s = local.state.submission;
  if (!s) return;
  const ms = local.state.modeState;
  const isSubmitter = s.playerId === local.myId;
  const eligible = local.state.players.filter(p => p.id !== s.playerId);
  const votes = s.votes || {};
  const yes = eligible.filter(p => votes[p.id] === 'yes').length;
  const no = eligible.filter(p => votes[p.id] === 'no').length;
  const youVoted = votes[local.myId];
  const root = el('div', {}, [
    roundHeader(),
    el('div', { class: 'pair' }, [
      cardEl(ms.anchor),
      cardEl(s.card),
    ]),
    el('div', { class: 'panel' }, [
      el('h3', {}, `${s.name} plays — ${s.degrees}°`),
      el('div', { class: 'chain-display', style: { marginTop: '10px' } }, s.chain),
      el('hr'),
      isSubmitter
        ? el('div', { class: 'center muted' }, 'Awaiting votes…')
        : (youVoted
            ? el('div', { class: 'center muted' }, `You voted ${youVoted}.`)
            : el('div', { class: 'vote-buttons' }, [
                el('button', { class: 'good', onclick: () => sendVote(true) }, '✓ Valid'),
                el('button', { class: 'danger', onclick: () => sendVote(false) }, '✗ Reject'),
              ])),
      el('div', { class: 'center small muted', style: { marginTop: '10px' } }, `${yes} accept · ${no} reject`),
    ]),
    footer(),
  ]);
  render(root);
}

/* ============================================================
   RENDER: CUSTOM
   ============================================================ */
function renderCustomPhase() {
  const cr = local.state.customRules;
  const root = el('div', {}, [
    roundHeader(),
    el('div', { class: 'panel pink' }, [
      el('h2', { style: { color: 'var(--paper)' } }, cr.title || 'House Rules'),
      el('div', { class: 'small', style: { whiteSpace: 'pre-wrap', marginTop: '8px' } }, cr.description || ''),
    ]),
    local.state.currentCard ? el('div', { class: 'single-card-wrap rotated' }, [cardEl(local.state.currentCard)]) : null,
    local.role === 'host' ? el('div', { class: 'panel' }, [
      el('button', { onclick: () => {
        if (local.state.deck.length === 0) { toast('Deck is empty', 'error'); return; }
        gameDrawNextCard();
      }}, 'Next card'),
      el('button', { class: 'danger', onclick: () => endGame() }, 'End game'),
    ]) : null,
    el('div', { class: 'panel' }, [
      el('h3', {}, 'Scores (tap to adjust)'),
      el('div', { class: 'scoreboard' }, local.state.players.map(p => el('div', { class: 'row-line' }, [
        el('div', {}, [p.name, isMe(p.id) ? el('span', { class: 'pill you', style: { marginLeft: '8px' } }, 'you') : null]),
        el('div', { class: 'row', style: { maxWidth: '160px', gap: '6px' } }, [
          el('button', { class: 'secondary', style: { padding: '6px 10px', marginTop: 0 }, onclick: () => {
            if (local.role === 'host') gameCustomScoreAdjust(local.myId, p.id, -1);
            else send({ type: 'score_adjust', target: p.id, delta: -1 });
          }}, '−1'),
          el('div', { style: { fontFamily: '"Bagel Fat One"', fontSize: '22px', minWidth: '36px', textAlign: 'center' } }, String(p.score)),
          el('button', { class: 'secondary', style: { padding: '6px 10px', marginTop: 0 }, onclick: () => {
            if (local.role === 'host') gameCustomScoreAdjust(local.myId, p.id, 1);
            else send({ type: 'score_adjust', target: p.id, delta: 1 });
          }}, '+1'),
        ]),
      ]))),
    ]),
    footer(),
  ]);
  render(root);
}

/* ============================================================
   RENDER: Generic round end & game over
   ============================================================ */
function renderRoundEndGeneric(text) {
  const root = el('div', {}, [
    roundHeader(),
    el('div', { class: 'panel center' }, [
      el('h2', {}, text || 'Round over.'),
      el('div', { class: 'small muted', style: { marginTop: '8px' } }, 'Next round in a moment…'),
    ]),
    el('details', { open: true }, [el('summary', {}, 'Scoreboard'), playersList()]),
    footer(),
  ]);
  render(root);
}

function renderGameOver() {
  const sorted = [...local.state.players].sort((a, b) => b.score - a.score);
  const topScore = sorted[0]?.score ?? 0;
  const isLowerBetter = local.state.mode === 'take_six';
  const winners = isLowerBetter
    ? sorted.filter(p => p.score === sorted[sorted.length - 1].score && (local.state.modeState?.hands?.[p.id]?.length === 0 || true))
    : sorted.filter(p => p.score === topScore && topScore > 0);
  const root = el('div', {}, [
    el('h1', { class: 'small center' }, 'Final Cut'),
    el('div', { class: 'tagline center' }, MODES[local.state.mode]?.label + ' — done.'),
    el('div', { class: 'panel' }, [
      el('div', { class: 'scoreboard' }, sorted.map(p => {
        const isLeader = isLowerBetter ? p.score === sorted[sorted.length - 1].score : (p.score === topScore && topScore > 0);
        return el('div', { class: 'row-line ' + (isLeader ? 'leader' : '') }, [
          el('div', {}, [
            isLeader ? '🏆 ' : '',
            p.name,
            isMe(p.id) ? el('span', { class: 'pill you', style: { marginLeft: '8px' } }, 'you') : null,
          ]),
          el('div', { style: { fontFamily: '"Bagel Fat One"', fontSize: '24px' } }, String(p.score)),
        ]);
      })),
    ]),
    local.role === 'host' ? el('div', { class: 'panel' }, [
      el('button', { onclick: () => { local.state.phase = 'mode_select'; broadcastState(); renderForPhase(); } }, 'Play another game'),
      el('button', { class: 'secondary', onclick: () => location.reload() }, 'Exit'),
    ]) : el('div', { class: 'panel center muted' }, 'Waiting for host…'),
    el('details', {}, [
      el('summary', {}, 'Round history'),
      el('div', {}, local.state.history.map((h, i) => el('div', { class: 'panel', style: { padding: '10px' } }, [
        el('div', { class: 'small muted' }, 'R' + (h.round || (i + 1)) + ' · ' + (h.mode || local.state.mode)),
        el('div', {}, h.winner ? `Winner: ${h.winner}` + (h.degrees ? ` (${h.degrees}°)` : '') : 'No winner'),
        h.chain ? el('div', { class: 'small muted' }, h.chain) : null,
      ]))),
    ]),
    footer(),
  ]);
  render(root);
}

/* ============================================================
   BOOT
   ============================================================ */
function urlRoomCode() {
  try {
    const code = new URLSearchParams(location.search).get('room');
    if (code && /^[A-Z0-9]+$/i.test(code) && code.length === ROOM_LEN) return code.toUpperCase();
  } catch {}
  return null;
}
function shareLinkForRoom(code) {
  const base = location.origin + location.pathname;
  return base + '?room=' + code;
}

function bootRoute() {
  const code = urlRoomCode();
  if (code) {
    // Auto-route to join screen
    screenJoinRoom();
    // Pre-fill the code field once rendered
    setTimeout(() => {
      const el = document.getElementById('code');
      if (el) el.value = code;
    }, 30);
  } else {
    screenHome();
  }
}

try {
  bootRoute();
} catch (err) {
  console.error('Boot error', err);
  const root = document.getElementById('app') || document.body;
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;color:#000;border:3px solid red;border-radius:12px;padding:14px;margin:12px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;';
  box.textContent = 'Boot failed: ' + (err.stack || err.message || String(err));
  root.appendChild(box);
}
</script>
</body>
</html>
